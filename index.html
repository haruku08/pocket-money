<style>
/* Layout: one phone-width column, big balance card on top, bottom tab bar like a banking app */
:root {
  --bg: #eef3f1;
  --surface: #ffffff;
  --surface-2: #e2ebe8;
  --ink: #0f2524;
  --muted: #5b716e;
  --line: #d3dfdb;
  --brand: #0f3b3a;      /* petrol, the hero card */
  --brand-ink: #f2fbf8;
  --accent: #ffc83d;     /* scooter yellow */
  --accent-ink: #2a1f00;
  --good: #1f9d6b;
  --bad: #d9534f;
  --warn: #c98a00;
  --c-gas: #f08a3c;
  --c-park: #7b6cf6;
  --c-debt: #d9534f;
  --c-free: #1f9d6b;
  --c-other: #3b8fd9;
  --shadow: 0 1px 2px rgba(15,37,36,.06), 0 6px 20px rgba(15,37,36,.06);
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1615; --surface: #13211f; --surface-2: #1b2d2a; --ink: #e6f2ef; --muted: #8fa7a2; --line: #253a37;
  --brand: #134a47; --brand-ink: #effaf7; --accent: #ffcc4d; --accent-ink: #2a1f00;
  --good: #3cc58c; --bad: #f07470; --warn: #e3ac2b;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark;
}}
:root[data-theme="dark"] {
  --bg: #0b1615; --surface: #13211f; --surface-2: #1b2d2a; --ink: #e6f2ef; --muted: #8fa7a2; --line: #253a37;
  --brand: #134a47; --brand-ink: #effaf7; --accent: #ffcc4d; --accent-ink: #2a1f00;
  --good: #3cc58c; --bad: #f07470; --warn: #e3ac2b;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 520px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h2 { font-size: 20px; font-weight: 800; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.muted { color: var(--muted); }
.row { display: flex; align-items: center; gap: 12px; }
.between { justify-content: space-between; }
.card { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.topbar { display: flex; justify-content: space-between; align-items: center; }
.topbar h1 { font-size: 22px; font-weight: 800; }
.month-pill { font-size: 13px; font-weight: 600; background: var(--surface-2); padding: 6px 12px; border-radius: 99px; }

/* Hero balance */
.hero { background: var(--brand); color: var(--brand-ink); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; border: 26px solid var(--accent); opacity: .16; }
.hero .label { color: color-mix(in srgb, var(--brand-ink) 70%, transparent); }
.hero-total { font-family: var(--f-display); font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.hero-total small { font-size: 18px; font-weight: 600; opacity: .7; margin-right: 6px; }
.accounts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.acct { background: color-mix(in srgb, var(--brand-ink) 10%, transparent); border: 0; color: inherit; text-align: left; border-radius: 14px; padding: 12px; font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.acct:hover { background: color-mix(in srgb, var(--brand-ink) 16%, transparent); }
.acct-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.acct-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.acct-bal { font-family: var(--f-display); font-size: 20px; font-weight: 600; }
.acct-hint { font-size: 11px; opacity: .65; }

/* Quick actions */
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.qa { border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 16px; padding: 12px 4px 10px; font: inherit; font-size: 12px; font-weight: 600; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
.qa:hover { background: var(--surface-2); }
.qa-ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; }
.qa-ic svg { width: 20px; height: 20px; }

/* Debt */
.debt-big { font-family: var(--f-display); font-size: 28px; font-weight: 800; }
.bar { height: 12px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar > span { display: block; height: 100%; }
.legend { display: flex; flex-direction: column; gap: 8px; }
.legend-row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.legend-row .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend-row .amt { margin-left: auto; font-weight: 600; }
.tag { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; }
.tag.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.tag.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.tag.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }

/* Log */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item-ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.item-ic svg { width: 18px; height: 18px; }
.item-main { flex: 1; min-width: 0; }
.item-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-sub { font-size: 12px; color: var(--muted); }
.item-amt { font-weight: 700; font-family: var(--f-mono); font-size: 14px; text-align: right; }
.item-amt.plus { color: var(--good); }
.del { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 8px; font-size: 18px; line-height: 1; }
.del:hover { color: var(--bad); background: var(--surface-2); }
.day-head { font-size: 12px; font-weight: 600; color: var(--muted); padding-top: 12px; text-transform: uppercase; letter-spacing: .06em; }
.empty { text-align: center; padding: 20px 8px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
input[type=number], input[type=text], input[type=date], select, textarea {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--surface-2); border: 1.5px solid transparent; border-radius: 12px; padding: 12px; width: 100%; min-width: 0;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); }
:root[data-theme="dark"] input:focus { border-color: var(--accent); }
.money-input { position: relative; }
.money-input span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; font-size: 14px; }
.money-input input { padding-left: 52px; font-family: var(--f-display); font-size: 26px; font-weight: 800; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { font: inherit; font-weight: 700; border: 0; border-radius: 14px; padding: 14px 18px; cursor: pointer; background: var(--accent); color: var(--accent-ink); font-size: 16px; }
.btn:hover { filter: brightness(.96); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.btn.small { padding: 9px 14px; font-size: 14px; border-radius: 11px; }
button:focus-visible, .acct:focus-visible, input[type=range]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 14px; font-weight: 600; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 12px; border-radius: 99px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.chip .d { width: 8px; height: 8px; border-radius: 50%; }

/* Sliders */
.slider { display: flex; flex-direction: column; gap: 6px; }
.slider-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.slider-top b { font-family: var(--f-mono); font-size: 14px; white-space: nowrap; }
.plan-lines { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
input[type=range] { width: 100%; accent-color: var(--brand); height: 28px; }
:root[data-theme="dark"] input[type=range] { accent-color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) input[type=range] { accent-color: var(--accent); } }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--f-display); font-size: 18px; font-weight: 800; }
.stat span { font-size: 11px; color: var(--muted); font-weight: 600; }
.callout { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); border-radius: 14px; padding: 12px 14px; font-size: 14px; }
.callout b { font-weight: 700; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--f-body); font-size: 10px; }

/* Bottom nav */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tabbar-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.tab { border: 0; background: none; font: inherit; font-size: 11px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; cursor: pointer; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab-add { justify-self: center; width: 54px; height: 54px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 45%, transparent); margin-top: -18px; }
.tab-add svg { width: 26px; height: 26px; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(5,15,14,.45); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); width: 100%; max-width: 520px; border-radius: 24px 24px 0 0; max-height: 92%; overflow-y: auto;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px; animation: up .22s ease-out;
}
.grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line); align-self: center; }
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); }
.preview-note { font-size: 12px; color: var(--muted); text-align: center; }
textarea { min-height: 90px; font-family: var(--f-mono); font-size: 12px; }
/* v2 additions */
.top-right { display: flex; gap: 8px; align-items: center; }
.lang { display: inline-flex; background: var(--surface-2); border-radius: 99px; padding: 3px; }
.lang button { font: inherit; font-size: 12px; font-weight: 700; border: 0; background: none; color: var(--muted); padding: 4px 9px; border-radius: 99px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.debt-list { display: flex; flex-direction: column; gap: 14px; }
.debt-row { display: flex; flex-direction: column; gap: 6px; }
.debt-row .row { gap: 8px; }
.debt-row .bar { height: 8px; }
.debt-name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.viewbar { background: var(--accent); color: var(--accent-ink); border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.viewbar div { flex: 1; min-width: 0; }
.viewbar b { display: block; }
.viewbar small { font-size: 12px; opacity: .8; }
.viewbar .btn { background: var(--accent-ink); color: var(--accent); }
.setup-debt { border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
</style>
</head>

  function simulate(p, months) {
    var savings = total(), debts = openDebts().map(function (d) { return debtLeftOf(d); });
    var sumDebt = function () { return debts.reduce(function (s, x) { return s + x; }, 0); };
    var rows = [{ m: 0, savings: savings, debt: sumDebt() }];
    var debtFree = sumDebt() <= 0 ? 0 : null, goalAt = savings >= p.goal ? 0 : null;
    for (var m = 1; m <= months; m++) {

      if (sumDebt() <= 0.001 && debtFree === null) debtFree = m;
      if (savings >= p.goal && goalAt === null) goalAt = m;
      rows.push({ m: m, savings: savings, debt: Math.max(0, sumDebt()) });

    return { rows: rows, debtFree: debtFree, goalAt: goalAt };

  function chartSvg(rows, goal) {
    var W = 340, H = 190, Lm = 40, R = 10, T = 12, B = 24;
    var vals = rows.map(function (r) { return r.savings; }).concat(rows.map(function (r) { return r.debt; }), [goal, 0]);
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var step = niceStep((max - min) / 4);
    min = Math.floor(min / step) * step; max = Math.ceil(max / step) * step;
    if (max === min) max = min + step;
    var x = function (i) { return Lm + i * (W - Lm - R) / (rows.length - 1); };
    var y = function (v) { return T + (max - v) / (max - min) * (H - T - B); };
    var g = "";
    for (var v = min; v <= max + 0.001; v += step) {
      g += '<line x1="' + Lm + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)" stroke-width="1"/>';
      g += '<text x="' + (Lm - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + chf0(v) + '</text>';
    }
    rows.forEach(function (r, i) { if (i % 2 === 0) g += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + (i === 0 ? t("now") : shortMonth(i)) + '</text>'; });
    function path(key) { return rows.map(function (r, i) { return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(r[key]).toFixed(1); }).join(" "); }
    var area = path("savings") + " L" + x(rows.length - 1) + " " + y(Math.max(min, 0)) + " L" + x(0) + " " + y(Math.max(min, 0)) + " Z";
    var last = rows[rows.length - 1];
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + t("chartLabel") + '">' + g +
      (goal <= max ? '<line x1="' + Lm + '" x2="' + (W - R) + '" y1="' + y(goal) + '" y2="' + y(goal) + '" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 4"/>' : "") +
      '<path d="' + area + '" fill="var(--good)" fill-opacity=".12"/>' +
      '<path d="' + path("debt") + '" fill="none" stroke="var(--bad)" stroke-width="2.5" stroke-linejoin="round"/>' +
      '<path d="' + path("savings") + '" fill="none" stroke="var(--good)" stroke-width="2.5" stroke-linejoin="round"/>' +
      '<circle cx="' + x(rows.length - 1) + '" cy="' + y(last.savings) + '" r="4" fill="var(--good)"/>' +
      '<text x="' + (x(rows.length - 1) - 6) + '" y="' + (y(last.savings) - 8) + '" text-anchor="end" style="fill:var(--ink);font-weight:700">' + chf0(last.savings) + '</text>' +
      '</svg>';
  }

  }

  function viewSettings() {
    var s = state.s;
    function nf(id, label, val, step) { return '<div class="field"><label for="' + id + '">' + label + '</label><input type="number" inputmode="decimal" id="' + id + '" value="' + val + '" step="' + (step || 1) + '" min="0"></div>'; }
    var debts = state.debts.map(function (d) {
      return '<div class="setup-debt" data-debt="' + d.id + '"><div class="field"><label for="dn-' + d.id + '">' + t("debtName") + '</label><input type="text" id="dn-' + d.id + '" value="' + esc(debtName(d)) + '" maxlength="30"></div>' +
        '<div class="grid3">' + nf("dt-" + d.id, t("debtTotal"), d.total) + nf("dm-" + d.id, t("debtMonthly"), d.monthly) + '</div>' +
        '<div class="row between" style="flex-wrap:wrap"><span class="muted" style="font-size:13px">' + t("paidSoFar", { n: chf(d.paid) }) + '</span><span class="rm-zone"><button class="btn danger small" data-rm="' + d.id + '">' + t("removeDebt") + '</button></span></div></div>';
    }).join("");
    var report = null;
    try { report = JSON.parse(localStorage.getItem(KEY + "-report")); } catch (e) {}
    return header(t("setup")) +
      (report ? '<section class="card"><div class="row between"><h3>' + esc(t("lastReport", { name: report.name || "?" })) + '</h3><button class="btn small" id="report-open">' + t("openReport") + '</button></div><p class="muted" style="font-size:13px">' + new Date(report.at).toLocaleString(loc(), { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) + '</p></section>' : "") +
      installBlock(false) +
      '<section class="card"><h2>' + t("syncTitle") + '</h2><p class="muted" style="font-size:13px">' + t("syncHint") + '</p>' +
        '<div class="field"><label for="sync-url">' + t("syncUrl") + '</label><input type="text" id="sync-url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(own.syncUrl || "") + '"></div>' +
        '<div class="row" style="flex-wrap:wrap"><button class="btn small" id="sync-save">' + t("syncNow") + '</button>' + (own.syncUrl ? '<button class="btn ghost small" id="sync-remove">' + t("syncRemove") + '</button>' : "") + '</div>' +
        '<p class="muted" id="sync-status" style="font-size:13px">' + esc(syncStatus()) + '</p></section>' +
      '<section class="card"><h2>' + t("parentTitle") + '</h2><p class="muted" style="font-size:13px">' + t("parentHint") + '</p>' +
        '<div class="field"><label for="set-name">' + t("f_name") + '</label><input type="text" id="set-name" value="' + esc(state.name || "") + '" maxlength="20"></div>' +
        '<button class="btn" id="share-parent">' + t("sendParent") + '</button><div id="share-fallback" hidden><div class="field"><label for="share-text">' + t("linkHere") + '</label><textarea id="share-text" readonly></textarea></div></div></section>' +
      '<section class="card"><h2>' + t("monthlyMoney") + '</h2><div class="grid2">' +
        nf("set-allowance", t("f_allowance"), s.allowance) + nf("set-parking", t("f_parking"), s.parking) +
        nf("set-gas", t("f_gas"), s.gas) + nf("set-other", t("f_other"), s.other) +
        nf("set-rate", t("f_rate"), s.rate, 0.5) + nf("set-hours", t("f_hours"), s.hours) +
      '</div></section>' +
      '<section class="card"><div class="row between"><h2>' + t("debts") + '</h2><button class="btn ghost small" id="debt-add">+ ' + t("addDebt") + '</button></div>' + (debts || '<p class="muted">' + t("noDebts") + '</p>') + '</section>' +
      '<section class="card"><h2>' + t("savingsGoal") + '</h2><div class="grid2">' +
        '<div class="field"><label for="set-goalName">' + t("whatFor") + '</label><input type="text" id="set-goalName" value="' + esc(goalName()) + '" maxlength="30"></div>' + nf("set-goalAmount", t("amountChf"), s.goalAmount) +
      '</div></section>' +
      '<section class="card"><h2>' + t("accounts") + '</h2><div class="grid2">' +
        state.accounts.map(function (a) { return '<div class="field"><label for="set-acct-' + a.id + '">' + t("accountName") + '</label><input type="text" id="set-acct-' + a.id + '" value="' + esc(a.name) + '" maxlength="20"></div>'; }).join("") +
      '</div></section>' +
      '<button class="btn" id="set-save">' + t("saveSetup") + '</button>' +
      '<section class="card"><h2>' + t("backup") + '</h2><p class="muted" style="font-size:13px">' + t("backupHint") + '</p>' +
        '<div class="row" style="flex-wrap:wrap"><button class="btn ghost small" id="bk-copy">' + t("copyBackup") + '</button><button class="btn ghost small" id="bk-show">' + t("restoreFrom") + '</button></div>' +
        '<div id="bk-area" hidden><div class="field"><label for="bk-text">' + t("pasteBackup") + '</label><textarea id="bk-text"></textarea></div><button class="btn small" id="bk-restore">' + t("restore") + '</button></div>' +
      '</section>' +
      '<section class="card"><h2>' + t("startOver") + '</h2><p class="muted" style="font-size:13px">' + t("startOverHint") + '</p><div id="reset-zone"><button class="btn danger small" id="reset-ask">' + t("deleteAll") + '</button></div></section>';
  }
  function saveSettings(quiet) {
    var el = function (id) { return document.getElementById(id); };
    if (!el("set-allowance")) return;
    var num = function (id, cur) { var v = Number(el(id).value); return el(id).value !== "" && v >= 0 ? v : cur; };
    ["allowance", "parking", "gas", "other", "rate", "hours", "goalAmount"].forEach(function (k) { state.s[k] = num("set-" + k, state.s[k]); });
    var gname = el("set-goalName").value.trim();
    state.s.goalName = gname === t("defaultGoal") ? "" : gname;
    state.name = el("set-name").value.trim();
    state.accounts.forEach(function (a) { var v = el("set-acct-" + a.id).value.trim(); if (v) a.name = v; });
    state.debts.forEach(function (d) {
      var n = el("dn-" + d.id); if (!n) return;
      var nv = n.value.trim(); d.name = (nv === t("licence") && !d.name) ? "" : nv;
      d.total = num("dt-" + d.id, d.total); d.monthly = num("dm-" + d.id, d.monthly);
    });
    ui.sim = null; save(); if (!quiet) toast(t("setupSaved"));
  }

  // ---------- share with parent ----------
  function b64u(bytes) { var s = ""; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  function unb64u(str) { str = str.replace(/-/g, "+").replace(/_/g, "/"); var s = atob(str), b = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; }
  function streamBytes(bytes, stream) { return new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer().then(function (b) { return new Uint8Array(b); }); }
  function encodeReport(obj) {
    var bytes = new TextEncoder().encode(JSON.stringify(obj));
    if (typeof CompressionStream === "function") return streamBytes(bytes, new CompressionStream("deflate-raw")).then(function (z) { return "z" + b64u(z); });
    return Promise.resolve("j" + b64u(bytes));
  }
  function decodeReport(code) {
    var kind = code[0], bytes = unb64u(code.slice(1));
    var p = kind === "z" ? streamBytes(bytes, new DecompressionStream("deflate-raw")) : Promise.resolve(bytes);
    return p.then(function (b) { return JSON.parse(new TextDecoder().decode(b)); });
  }
  function shareParent() {
    saveSettings(true);
    var snap = { at: Date.now(), name: own.name || "", state: own };
    encodeReport(snap).then(function (code) {
      var url = location.href.split("#")[0] + "#view=" + code;
      var text = t("shareText", { name: own.name || t("appName"), total: chf(total()), debt: chf(debtLeft()) });
      var fallback = function () {
        var box = document.getElementById("share-fallback"); if (!box) return;
        box.hidden = false; var ta = document.getElementById("share-text"); ta.value = text + "\n" + url; ta.focus(); ta.select();
      };
      if (navigator.share) {
        navigator.share({ title: t("appName"), text: text, url: url }).catch(function (e) { if (e && e.name !== "AbortError") fallback(); });
      } else {
        try { navigator.clipboard.writeText(text + "\n" + url).then(function () { toast(t("linkCopied")); }, fallback); } catch (e) { fallback(); }
      }
    });
  }
  function openReport(rep) {
    ui.viewing = { at: rep.at, name: rep.name };
    state = normalize(rep.state);
    ui.tab = "home"; ui.sim = null; render(); window.scrollTo(0, 0);
  }
  function closeReport() { ui.viewing = null; state = own; ui.sim = null; ui.tab = "home"; render(); window.scrollTo(0, 0); }
  function checkHash() {
    var h = location.hash || "";
    if (h.indexOf("#sync=") === 0) {
      var su = ""; try { su = decodeURIComponent(h.slice(6)); } catch (e) {}
      try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
      if (/^https:\/\/script\.google(usercontent)?\.com\//.test(su)) { own.syncUrl = su; own.syncErr = false; persist(); syncNow(); toast(t("syncConnected")); render(); }
      else toast(t("syncBad"));
      return true;
    }
    if (h.indexOf("#view=") !== 0) return false;
    var code = h.slice(6);
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    decodeReport(code).then(function (rep) {
      try { localStorage.setItem(KEY + "-report", JSON.stringify(rep)); } catch (e) {}
      openReport(rep);
    }).catch(function () { toast(t("badCode")); });
    return true;
  }

  // ---------- sheets ----------
  var layer = document.getElementById("layer");
  function sheetShell(title, body) {
    layer.innerHTML = '<div class="scrim" id="scrim"><form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" novalidate>' +
      '<div class="grab"></div><div class="row between"><h2 id="sheet-title">' + title + '</h2><button type="button" class="btn ghost small" id="sheet-close">' + t("close") + '</button></div>' + body + '</form></div>';
    document.getElementById("sheet-close").onclick = closeSheet;
    document.getElementById("scrim").addEventListener("click", function (ev) { if (ev.target.id === "scrim") closeSheet(); });
  }
  function openSheet(type, accountId) {
    type = type || "spend";
    var s = state.s;
    var order = ["allowance", "job", "income", "gas", "parking", "debt", "spend", "balance"];
    if (type === "debt" && !openDebts().length) type = "spend";
    var chips = order.filter(function (k) { return k !== "debt" || openDebts().length; }).map(function (k) { return '<button type="button" class="chip" data-type="' + k + '" aria-pressed="' + (k === type) + '"><span class="d" style="background:' + TYPES[k].color + '"></span>' + t("ty_" + k) + '</button>'; }).join("");
    var accOpts = state.accounts.map(function (a) { return '<option value="' + a.id + '"' + (a.id === (accountId || state.accounts[0].id) ? " selected" : "") + '>' + esc(a.name) + ' (CHF ' + chf(a.balance) + ')</option>'; }).join("");
    var debtOpts = openDebts().map(function (d) { return '<option value="' + d.id + '">' + esc(debtName(d)) + ' (CHF ' + chf(debtLeftOf(d)) + ')</option>'; }).join("");
    sheetShell(t("newEntry"),
      '<div class="chips" id="type-chips">' + chips + '</div>' +
      '<div class="field" id="f-debt" hidden><label for="in-debt">' + t("whichDebt") + '</label><select id="in-debt">' + debtOpts + '</select></div>' +
      '<div class="field" id="f-hours" hidden><label for="in-hours">' + t("hoursWorked") + '</label><input type="number" inputmode="decimal" id="in-hours" step="0.25" min="0" placeholder="' + t("hoursEx") + '"></div>' +
      '<div class="field"><label for="in-amount" id="lbl-amount">' + t("amount") + '</label><div class="money-input"><span>CHF</span><input type="number" inputmode="decimal" id="in-amount" step="0.05" min="0" placeholder="0.00"></div></div>' +
      '<div class="grid2"><div class="field"><label for="in-account">' + t("account") + '</label><select id="in-account">' + accOpts + '</select></div><div class="field"><label for="in-date">' + t("date") + '</label><input type="date" id="in-date" value="' + today() + '"></div></div>' +
      '<div class="field"><label for="in-note">' + t("noteOpt") + '</label><input type="text" id="in-note" maxlength="40" placeholder="' + t("noteEx") + '"></div>' +
      '<p class="muted" id="sheet-hint" style="font-size:13px"></p>' +
      '<button class="btn" type="submit">' + t("saveEntry") + '</button>');
    var cur = type;
    var amt = document.getElementById("in-amount"), hrs = document.getElementById("in-hours"), dsel = document.getElementById("in-debt");
    function debtDefault() { var d = debtById(dsel.value); return d ? Math.min(d.monthly, debtLeftOf(d)) || "" : ""; }
    function setType(k) {
      cur = k;
      document.querySelectorAll("#type-chips .chip").forEach(function (c) { c.setAttribute("aria-pressed", c.dataset.type === k); });
      document.getElementById("f-hours").hidden = k !== "job";
      document.getElementById("f-debt").hidden = k !== "debt";
      document.getElementById("lbl-amount").textContent = k === "balance" ? t("balanceShown") : k === "job" ? t("earned") : t("amount");
      var d = debtById(dsel.value);
      document.getElementById("sheet-hint").textContent = t("h_" + k, { n: k === "allowance" ? chf0(s.allowance) : k === "gas" ? chf0(s.gas) : k === "parking" ? chf0(s.parking) : k === "debt" && d ? chf(debtLeftOf(d)) : "", r: s.rate });
      if (k === "balance") amt.value = acct(document.getElementById("in-account").value).balance || "";
      else amt.value = { allowance: s.allowance, parking: s.parking, debt: debtDefault() }[k] || "";
      if (k === "job") hrs.value = "";
    }
    setType(type);
    document.getElementById("type-chips").addEventListener("click", function (ev) { var c = ev.target.closest(".chip"); if (c) setType(c.dataset.type); });
    document.getElementById("in-account").addEventListener("change", function () { if (cur === "balance") amt.value = acct(this.value).balance || ""; });
    dsel.addEventListener("change", function () { setType("debt"); });
    hrs.addEventListener("input", function () { var h = Number(hrs.value); amt.value = h > 0 ? r2(h * s.rate) : ""; });
    document.getElementById("sheet").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var a = Number(amt.value);
      if (!(a >= 0) || amt.value === "" || (a === 0 && cur !== "balance")) { amt.focus(); toast(t("typeAmount")); return; }
      var e = { type: cur, amount: r2(a), account: document.getElementById("in-account").value, date: document.getElementById("in-date").value || today(), note: document.getElementById("in-note").value.trim() };
      if (cur === "job") e.hours = Number(hrs.value) || r2(a / s.rate);
      if (cur === "debt") { var d = debtById(dsel.value); e.debtId = dsel.value; if (d && e.amount > debtLeftOf(d)) e.amount = debtLeftOf(d); }
      addEntry(e);
      closeSheet(); render();
      toast(cur === "balance" ? t("balUpdated") : t("savedLog"));
    });
    setTimeout(function () { (cur === "job" ? hrs : amt).focus(); }, 60);
  }
  function openDebtSheet() {
    if (ui.tab === "settings") saveSettings(true);
    sheetShell(t("newDebtTitle"),
      '<div class="field"><label for="nd-name">' + t("debtName") + '</label><input type="text" id="nd-name" maxlength="30" placeholder="' + t("debtNameEx") + '"></div>' +
      '<div class="field"><label for="nd-total">' + t("debtTotal") + '</label><div class="money-input"><span>CHF</span><input type="number" inputmode="decimal" id="nd-total" step="1" min="0" placeholder="0"></div></div>' +
      '<div class="grid2"><div class="field"><label for="nd-monthly">' + t("debtMonthly") + '</label><input type="number" inputmode="decimal" id="nd-monthly" step="5" min="0" value="20"></div>' +
      '<div class="field"><label for="nd-paid">' + t("debtAlready") + '</label><input type="number" inputmode="decimal" id="nd-paid" step="5" min="0" value="0"></div></div>' +
      '<button class="btn" type="submit">' + t("saveDebt") + '</button>');
    document.getElementById("sheet").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var name = document.getElementById("nd-name").value.trim(), tot = Number(document.getElementById("nd-total").value);
      if (!name) { document.getElementById("nd-name").focus(); toast(t("needName")); return; }
      if (!(tot > 0)) { document.getElementById("nd-total").focus(); toast(t("typeAmount")); return; }
      addDebt(name, tot, Number(document.getElementById("nd-monthly").value) || 0, Number(document.getElementById("nd-paid").value) || 0);
      ui.sim = null; closeSheet(); render(); toast(t("debtAdded"));
    });
    setTimeout(function () { document.getElementById("nd-name").focus(); }, 60);
  }
  function closeSheet() { layer.innerHTML = ""; }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && layer.innerHTML) closeSheet(); });

  var toastTimer;
  function toast(msg) {
    var el = document.querySelector(".toast"); if (el) el.remove();
    el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
    document.body.appendChild(el); clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.remove(); }, 2400);
  }

  // ---------- events ----------
  document.querySelector(".tabbar").addEventListener("click", function (ev) { var b = ev.target.closest("[data-tab]"); if (b) go(b.dataset.tab); });
  function go(tab) { ui.tab = tab; try { sessionStorage.setItem(KEY + "-tab", tab); } catch (e) {} render(); window.scrollTo(0, 0); }
  document.getElementById("addBtn").onclick = function () { openSheet("spend"); };

  app.addEventListener("click", function (ev) {
    var b, id = ev.target.id;
    if ((b = ev.target.closest("[data-lang]"))) {
      if (ui.tab === "settings") saveSettings(true);
      own.lang = b.dataset.lang; if (ui.viewing) { try { localStorage.setItem(KEY, JSON.stringify(own)); } catch (e) {} } else save(); render(); return;
    }
    if (ui.viewing && id === "view-close") return closeReport();
    if ((b = ev.target.closest("[data-go]"))) return go(b.dataset.go);
    if (ui.viewing) return;
    if ((b = ev.target.closest("[data-quick]"))) return openSheet(b.dataset.quick);
    if ((b = ev.target.closest("[data-act=balance]"))) return openSheet("balance", b.dataset.acct);
    if ((b = ev.target.closest("[data-del]"))) {
      if (b.dataset.confirm) { if (removeEntry(b.dataset.del)) { render(); toast(t("entryDeleted")); } else toast(t("deletePaymentsFirst")); }
      else { b.dataset.confirm = "1"; b.textContent = t("delQ"); b.style.fontSize = "12px"; b.style.color = "var(--bad)"; setTimeout(function () { if (b.isConnected) { delete b.dataset.confirm; b.textContent = "×"; b.style.fontSize = ""; b.style.color = ""; } }, 3000); }
      return;
    }
    if ((b = ev.target.closest("[data-rm]"))) {
      saveSettings(true);
      b.parentNode.innerHTML = '<span class="row" style="gap:6px;flex-wrap:wrap"><button class="btn danger small" data-rm-yes="' + b.dataset.rm + '">' + t("yesRemove") + '</button><button class="btn ghost small" data-rm-no="1">' + t("cancel") + '</button></span>';
      return;
    }
    if ((b = ev.target.closest("[data-rm-yes]"))) {
      var did = b.dataset.rmYes;
      state.debts = state.debts.filter(function (d) { return d.id !== did; });
      state.entries = state.entries.filter(function (e) { return !(e.type === "newdebt" && e.debtId === did); });
      ui.sim = null; save(); render(); toast(t("debtRemoved")); return;
    }
    if (ev.target.closest("[data-rm-no]")) { render(); return; }
    if (id === "debt-add") return openDebtSheet();
    if (id === "sync-save") {
      var u = document.getElementById("sync-url").value.trim();
      if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) { toast(t("syncBad")); return; }
      own.syncUrl = u; own.syncErr = false; persist(); syncNow(true); render(); return;
    }
    if (id === "install-go" && installEvt) { installEvt.prompt(); installEvt.userChoice.then(function () { installEvt = null; render(); }); return; }
    if (id === "install-later") { own.installLater = true; persist(); render(); return; }
    if (id === "sync-remove") { own.syncUrl = ""; own.syncAt = 0; persist(); render(); return; }
    if (id === "share-parent") return shareParent();
    if (id === "report-open") { try { openReport(JSON.parse(localStorage.getItem(KEY + "-report"))); } catch (e) {} return; }
    if (id === "sim-save") {
      var p = ui.sim, due = monthlyDebtDue();
      state.s.hours = p.hours; state.s.gas = p.gas; state.s.other = p.other;
      if (due > 0 && Math.abs(p.debtPayment - due) > 0.01) {
        var f = p.debtPayment / due;
        openDebts().forEach(function (d) { d.monthly = Math.max(0, Math.round(d.monthly * f / 5) * 5); });
      }
      save(); toast(t("budgetUpdated")); return;
    }
    if (id === "set-save") return saveSettings();
    if (id === "bk-copy") {
      var code = btoa(unescape(encodeURIComponent(JSON.stringify(own))));
      var fallback = function () { document.getElementById("bk-area").hidden = false; var ta = document.getElementById("bk-text"); ta.value = code; ta.select(); toast(t("selectCopy")); };
      try { navigator.clipboard.writeText(code).then(function () { toast(t("backupCopied")); }, fallback); } catch (e) { fallback(); }
      return;
    }
    if (id === "bk-show") { document.getElementById("bk-area").hidden = false; document.getElementById("bk-text").focus(); return; }
    if (id === "bk-restore") {
      try {
        var data = JSON.parse(decodeURIComponent(escape(atob(document.getElementById("bk-text").value.trim()))));
        if (!data.accounts || !data.entries) throw 0;
        own = state = normalize(data); save(); ui.sim = null; go("home"); toast(t("backupRestored"));
      } catch (e) { toast(t("badCode")); }
      return;
    }
    if (id === "reset-ask") {
      document.getElementById("reset-zone").innerHTML = '<div class="row" style="flex-wrap:wrap"><span style="font-weight:600">' + t("reallyDelete") + '</span><button class="btn danger small" id="reset-yes">' + t("yesDelete") + '</button><button class="btn ghost small" id="reset-no">' + t("cancel") + '</button></div>';
      return;
    }
    if (id === "reset-no") { render(); return; }
    if (id === "reset-yes") { var l = own.lang; own = state = normalize(null); own.lang = l; save(); ui.sim = null; go("home"); toast(t("allDeleted")); return; }
  });
  app.addEventListener("input", function (ev) { if (ev.target.id && ev.target.id.indexOf("sim-") === 0) { readSim(); updatePlan(); } });
  window.addEventListener("hashchange", checkHash);

  try { if ("serviceWorker" in navigator && canInstall()) navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
  render();
  if (!checkHash() && own.syncUrl) setTimeout(syncNow, 2500);
})();
</script>
</body>
