<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Money</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sackgeld">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef2f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* ---------- tokens ---------- */
:root {
  --bg: #eef2f0;
  --surface: #ffffff;
  --surface-2: #e4ebe8;
  --ink: #12201e;
  --muted: #5e6f6b;
  --line: #d6dfdb;
  --brand: #123f3c;      /* petrol: hero card, active states */
  --brand-ink: #f1faf7;
  --accent: #ffc83d;     /* scooter yellow: main actions */
  --accent-ink: #2a1f00;
  --good: #1b8f61;
  --bad: #cf4b47;
  --warn: #b97f00;
  --c-gas: #ea7f33;
  --c-park: #6f61ea;
  --c-debt: #cf4b47;
  --c-free: #1b8f61;
  --c-other: #3384cf;
  --c-save: #13897a;
  --shadow: 0 1px 2px rgba(18,32,30,.05), 0 4px 16px rgba(18,32,30,.05);
  --scrim: rgba(8,16,15,.45);

  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;

  /* one radius scale and one spacing scale for the whole app */
  --r-sm: 10px;   /* tags inside rows, small buttons */
  --r-md: 14px;   /* inputs, buttons, tiles */
  --r-lg: 20px;   /* cards, sheets */
  --r-pill: 999px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
}
/* Dark: warm charcoal with a hint of green, not pure black */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --surface: #1a1f1d; --surface-2: #232a27; --ink: #e8eeeb; --muted: #97a39f; --line: #2c3431;
  --brand: #1c3f3b; --brand-ink: #eef7f4; --accent: #f2c14e; --accent-ink: #261c00;
  --good: #4cc08f; --c-free: #4cc08f; --c-save: #3ab8a6; --bad: #ec7a75; --c-debt: #ec7a75; --warn: #dfae3f;
  --c-gas: #f0965a; --c-park: #9488f2; --c-other: #62a5e4;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 4px 18px rgba(0,0,0,.28); --scrim: rgba(0,0,0,.55);
  color-scheme: dark;
}}
:root[data-theme="dark"] {
  --bg: #121614; --surface: #1a1f1d; --surface-2: #232a27; --ink: #e8eeeb; --muted: #97a39f; --line: #2c3431;
  --brand: #1c3f3b; --brand-ink: #eef7f4; --accent: #f2c14e; --accent-ink: #261c00;
  --good: #4cc08f; --c-free: #4cc08f; --c-save: #3ab8a6; --bad: #ec7a75; --c-debt: #ec7a75; --warn: #dfae3f;
  --c-gas: #f0965a; --c-park: #9488f2; --c-other: #62a5e4;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 4px 18px rgba(0,0,0,.28); --scrim: rgba(0,0,0,.55);
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 24px; font-weight: 800; }
h2 { font-size: 18px; font-weight: 800; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
svg { flex: none; }
.ic { width: 18px; height: 18px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small-text { font-size: 13px; }
.label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }

.wrap {
  max-width: 520px; margin: 0 auto;
  padding-left: max(var(--s-4), env(safe-area-inset-left, 0px));
  padding-right: max(var(--s-4), env(safe-area-inset-right, 0px));
  padding-top: calc(var(--s-4) + env(safe-area-inset-top, 0px));
  padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: var(--s-4);
}
.row { display: flex; align-items: center; gap: var(--s-3); }
.row.wrapping { flex-wrap: wrap; gap: var(--s-2); }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: var(--s-2); }
.card { background: var(--surface); border-radius: var(--r-lg); padding: var(--s-4); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: var(--s-3); min-width: 0; }
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); min-width: 0; }
.link-btn { font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); background: none; border: 0; padding: var(--s-1) 0; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; }
.link-btn:hover { color: var(--ink); }
.link-btn svg { width: 16px; height: 16px; }

/* ---------- top bar ---------- */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: var(--s-2); min-height: 36px; }
.topbar h1 { white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.top-right { display: flex; gap: var(--s-2); align-items: center; }
.pill { font-size: 13px; font-weight: 600; background: var(--surface-2); padding: 6px 12px; border-radius: var(--r-pill); white-space: nowrap; }
.brand { display: inline-flex; align-items: center; gap: 10px; }
.brand-ic { width: 32px; height: 32px; border-radius: var(--r-sm); background: var(--brand); color: var(--accent); display: grid; place-items: center; flex: none; }
.brand-ic svg { width: 18px; height: 18px; }

/* segmented switcher (Home sections, Setup sections, week/month) */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: var(--r-md); padding: 3px; gap: 2px; }
.seg button { font: inherit; font-size: 14px; font-weight: 600; border: 0; background: none; color: var(--muted); padding: 8px 10px; border-radius: 11px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"], .seg button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg.mini { display: inline-grid; border-radius: var(--r-pill); }
.seg.mini button { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: var(--r-pill); }

/* ---------- hero ---------- */
.hero { background: var(--brand); color: var(--brand-ink); border-radius: var(--r-lg); padding: 20px; display: flex; flex-direction: column; gap: var(--s-4); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -48px; top: -48px; width: 168px; height: 168px; border-radius: 50%; border: 26px solid var(--accent); opacity: .14; pointer-events: none; }
.hero .label { color: color-mix(in srgb, var(--brand-ink) 70%, transparent); }
.hero-total { font-family: var(--f-display); font-size: 42px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.hero-total small { font-size: 17px; font-weight: 600; opacity: .7; margin-right: 6px; }
.accounts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.acct { background: color-mix(in srgb, var(--brand-ink) 9%, transparent); border: 0; color: inherit; text-align: left; border-radius: var(--r-md); padding: var(--s-3); font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.acct:hover:not([disabled]) { background: color-mix(in srgb, var(--brand-ink) 15%, transparent); }
.acct[disabled] { cursor: default; }
.acct-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; }
.acct-name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct-name .edit { margin-left: auto; width: 14px; height: 14px; opacity: .55; }
.acct-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.acct-bal { font-family: var(--f-display); font-size: 20px; font-weight: 600; }

/* ---------- quick actions ---------- */
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-2); }
.qa { border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: var(--r-md); padding: var(--s-3) var(--s-1) 10px; font: inherit; font-size: 12px; font-weight: 600; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
.qa:hover { background: var(--surface-2); }
.qa-ic, .item-ic { width: 36px; height: 36px; border-radius: var(--r-sm); display: grid; place-items: center; flex: none; }
.qa-ic svg { width: 20px; height: 20px; }
.item-ic svg { width: 18px; height: 18px; }

/* ---------- "left until payday" ---------- */
.big { font-family: var(--f-display); font-size: 32px; font-weight: 800; line-height: 1.05; letter-spacing: -.01em; }
.big.bad { color: var(--bad); }
.meter { height: 10px; border-radius: var(--r-pill); background: var(--surface-2); overflow: hidden; display: flex; }
.meter > span { display: block; height: 100%; }
.meter.thin { height: 6px; }
.meter-key { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); gap: var(--s-2); }
.checks { display: flex; flex-direction: column; }
.check { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; min-width: 0; }
.check-dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 1.5px solid var(--line); color: transparent; }
.check-dot svg { width: 14px; height: 14px; }
.check.done .check-dot { background: var(--good); border-color: var(--good); color: var(--surface); }
.check.over .check-dot { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.check-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.check-amt { font-family: var(--f-mono); font-size: 13px; white-space: nowrap; }
.check .btn { padding: 5px 10px; font-size: 13px; }

/* ---------- breakdown & debts ---------- */
.legend { display: flex; flex-direction: column; gap: var(--s-2); }
.legend-row { display: flex; align-items: center; gap: 10px; font-size: 14px; min-width: 0; }
.legend-row .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend-row .amt { margin-left: auto; font-weight: 600; white-space: nowrap; }
.legend-row .tag { white-space: nowrap; }
.bd-h { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: var(--s-2); }
.bd-tip { font-size: 13px; color: var(--muted); }
.bd-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd-nav { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); }
.icon-btn { width: 36px; height: 36px; border: 0; border-radius: var(--r-sm); background: var(--surface-2); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn[disabled] { opacity: .35; cursor: default; }
.total-row { display: flex; justify-content: space-between; align-items: baseline; border-top: 1.5px solid var(--line); padding-top: var(--s-2); font-weight: 700; font-size: 14px; }
.total-row b { font-family: var(--f-display); font-size: 17px; }
.debt-list { display: flex; flex-direction: column; gap: var(--s-3); }
.debt-row { display: flex; flex-direction: column; gap: 6px; }
.debt-row .row { gap: var(--s-2); }
.debt-name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: var(--r-pill); background: var(--surface-2); display: inline-flex; align-items: center; gap: 4px; }
.tag svg { width: 12px; height: 12px; }
.tag.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.tag.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.tag.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.cat-list { display: flex; flex-direction: column; gap: var(--s-2); }
.cat-row { gap: var(--s-2); }
.cat-row input { flex: 1; min-width: 0; }
.cat-chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- log ---------- */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: var(--s-3); padding: 10px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item-main { flex: 1; min-width: 0; }
.item-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-sub { font-size: 12px; color: var(--muted); }
.item-amt { font-weight: 700; font-family: var(--f-mono); font-size: 14px; text-align: right; white-space: nowrap; }
.item-amt.plus { color: var(--good); }
.del { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 6px; border-radius: var(--r-sm); line-height: 1; display: grid; place-items: center; font: inherit; font-size: 12px; font-weight: 700; min-width: 30px; min-height: 30px; }
.del svg { width: 16px; height: 16px; }
.del:hover { color: var(--bad); background: var(--surface-2); }
.del.confirm { color: var(--bad); }
.day-head { font-size: 12px; font-weight: 600; color: var(--muted); padding-top: var(--s-3); text-transform: uppercase; letter-spacing: .06em; }
.empty { text-align: center; padding: 20px 8px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.appr { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: var(--s-1); }
.appr .tag { font-size: 11px; padding: 2px 8px; }
.pnote { font-size: 12px; color: var(--ink); font-style: italic; }
.pv-acts { display: flex; gap: var(--s-2); padding: 0 0 10px 48px; border-bottom: 1px solid var(--line); margin-top: -4px; flex-wrap: wrap; }
.pv-acts .btn { padding: 7px 12px; font-size: 13px; }
.item:has(+ .pv-acts) { border-bottom: 0; }
.list.gone .item { opacity: .55; text-decoration: line-through; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
input[type=number], input[type=text], input[type=date], select, textarea {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--surface-2); border: 1.5px solid transparent; border-radius: var(--r-md); padding: var(--s-3); width: 100%; min-width: 0;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); }
:root[data-theme="dark"] input:focus, :root[data-theme="dark"] select:focus { border-color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) input:focus, :root:not([data-theme="light"]) select:focus { border-color: var(--accent); } }
textarea { min-height: 90px; font-family: var(--f-mono); font-size: 12px; }
.money-input { position: relative; }
.money-input span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; font-size: 14px; }
.money-input input { padding-left: 52px; font-family: var(--f-display); font-size: 26px; font-weight: 800; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { font: inherit; font-weight: 700; border: 0; border-radius: var(--r-md); padding: 13px 18px; cursor: pointer; background: var(--accent); color: var(--accent-ink); font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); }
.btn svg { width: 18px; height: 18px; }
.btn:hover { filter: brightness(.96); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.btn.small { padding: 9px 14px; font-size: 14px; border-radius: var(--r-sm); }
.btn.small svg { width: 16px; height: 16px; }
.btn.start { align-self: flex-start; }
button:focus-visible, .acct:focus-visible, input[type=range]:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.chip { font: inherit; font-size: 14px; font-weight: 600; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 12px; border-radius: var(--r-pill); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.chip .d { width: 8px; height: 8px; border-radius: 50%; }
details.more > summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 6px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary svg { width: 16px; height: 16px; transition: transform .15s; }
details.more[open] > summary svg { transform: rotate(90deg); }
details.more[open] > summary { margin-bottom: var(--s-3); }
details.more > div { display: flex; flex-direction: column; gap: var(--s-3); }

/* ---------- plan ---------- */
.slider { display: flex; flex-direction: column; gap: 6px; }
.slider-top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-2); font-size: 14px; }
.slider-top b { font-family: var(--f-mono); font-size: 13px; white-space: nowrap; }
input[type=range] { width: 100%; accent-color: var(--brand); height: 28px; }
:root[data-theme="dark"] input[type=range] { accent-color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) input[type=range] { accent-color: var(--accent); } }
.save-slider { background: color-mix(in srgb, var(--c-save) 12%, transparent); border-radius: var(--r-md); padding: 10px var(--s-3); }
.save-slider input[type=range] { accent-color: var(--c-save); }
.plan-lines { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.callout { background: color-mix(in srgb, var(--accent) 20%, var(--surface)); border-radius: var(--r-md); padding: var(--s-3) 14px; font-size: 14px; display: flex; flex-direction: column; gap: var(--s-2); }
.callout.good { background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.callout.bad { background: color-mix(in srgb, var(--bad) 16%, var(--surface)); }
.callout.row { flex-direction: row; }
.callout b { font-weight: 700; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--f-body); font-size: 10px; }
.chart-key { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.chart-key span { display: inline-flex; align-items: center; gap: 6px; }
.chart-key i { display: inline-block; }
.k-bar { width: 10px; height: 12px; border-radius: 2px; background: var(--c-save); }
.k-line { width: 16px; height: 3px; border-radius: 2px; background: var(--bad); }
.k-dash { width: 16px; border-top: 2px dashed var(--warn); }
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-row { display: flex; justify-content: space-between; font-size: 15px; gap: var(--s-2); }
.flow-row b { font-family: var(--f-mono); font-size: 14px; white-space: nowrap; }
.flow-row.total { border-top: 1.5px solid var(--line); padding-top: var(--s-2); font-weight: 700; }
.flow-row.total b { font-family: var(--f-display); font-size: 20px; }
.ftable { display: flex; flex-direction: column; font-size: 13px; }
.fr { display: grid; grid-template-columns: 1.1fr 1fr 1fr 1fr; gap: 6px; padding: 7px 0; border-bottom: 1px solid var(--line); text-align: right; }
.fr span:first-child { text-align: left; color: var(--muted); }
.fr:last-child { border-bottom: 0; }
.fr5 .fr { grid-template-columns: 1fr 1fr .8fr 1fr 1fr; }
.fh { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.hist-row { font: inherit; font-size: 13px; color: var(--ink); background: none; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; width: 100%; border-radius: 0; }
.hist-row.on { background: var(--surface-2); }

/* ---------- setup ---------- */
.pvd { display: flex; flex-direction: column; gap: var(--s-2); padding: 10px 0; border-bottom: 1px solid var(--line); }
.code { font-size: 28px; font-weight: 800; letter-spacing: .08em; }

.viewbar div { flex: 1; min-width: 0; }

.viewbar small { font-size: 12px; opacity: .8; }
.viewbar .btn { background: var(--accent-ink); color: var(--accent); }
.preview-note { font-size: 12px; color: var(--muted); text-align: center; }

/* ---------- bottom tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tabbar-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.tab { border: 0; background: none; font: inherit; font-size: 11px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; cursor: pointer; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab-add { justify-self: center; width: 52px; height: 52px; border-radius: var(--r-lg); border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 40%, transparent); margin-top: -18px; }

.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }

.grab { width: 40px; height: 5px; border-radius: var(--r-pill); background: var(--line); align-self: center; }
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }

      '<button class="btn" type="submit">' + t("saveEntry") + '</button>');
    var cur = type;
    var amt = document.getElementById("in-amount"), hrs = document.getElementById("in-hours"), dsel = document.getElementById("in-debt");
    function debtDefault() { var d = debtById(dsel.value); return d ? Math.min(d.monthly, debtLeftOf(d)) || "" : ""; }
    function setType(k) {
      cur = k;
      document.querySelectorAll("#type-chips .chip").forEach(function (c) { c.setAttribute("aria-pressed", c.dataset.type === k); });
      document.getElementById("f-hours").hidden = k !== "job";
      document.getElementById("f-debt").hidden = k !== "debt";
      document.getElementById("f-cat").hidden = k !== "spend";
      document.getElementById("lbl-amount").textContent = k === "balance" ? t("balanceShown") : k === "job" ? t("earned") : t("amount");
      var d = debtById(dsel.value);
      var wkA = k === "allowance" && s.allowMode === "week";
      document.getElementById("sheet-hint").textContent = t(wkA ? "h_allowanceW" : "h_" + k, { d: wkA ? wdName(allowObj(s).day) : "", n: k === "allowance" ? chf0(perPay(allowObj(s))) : k === "gas" ? chf0(s.gas) : k === "parking" ? chf0(s.parking) : k === "debt" && d ? chf(debtLeftOf(d)) : "", r: s.rate });
      if (k === "balance") amt.value = acct(document.getElementById("in-account").value).balance || "";
      else amt.value = { allowance: perPay(allowObj(s)), parking: s.parking, debt: debtDefault() }[k] || "";
      if (k === "job") hrs.value = "";
    }
    setType(type);
    document.getElementById("type-chips").addEventListener("click", function (ev) { var c = ev.target.closest(".chip"); if (c) setType(c.dataset.type); });
    document.getElementById("in-account").addEventListener("change", function () { if (cur === "balance") amt.value = acct(this.value).balance || ""; });
    dsel.addEventListener("change", function () { setType("debt"); });
    var pickedCat = "", newCat = document.getElementById("in-cat-new");
    document.getElementById("cat-chips").addEventListener("click", function (ev) {
      var c = ev.target.closest(".chip"); if (!c) return;
      var isNew = c.id === "cat-new-btn", on = c.getAttribute("aria-pressed") !== "true";
      document.querySelectorAll("#cat-chips .chip").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
      if (on) c.setAttribute("aria-pressed", "true");
      pickedCat = on && !isNew ? c.dataset.cat : "";
      newCat.hidden = !(on && isNew); if (!newCat.hidden) newCat.focus();
    });
    hrs.addEventListener("input", function () { var h = Number(hrs.value); amt.value = h > 0 ? r2(h * s.rate) : ""; });
    document.getElementById("sheet").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var a = Number(amt.value);
      if (!(a >= 0) || amt.value === "" || (a === 0 && cur !== "balance")) { amt.focus(); toast(t("typeAmount")); return; }
      var e = { type: cur, amount: r2(a), account: document.getElementById("in-account").value, date: document.getElementById("in-date").value || today(), note: document.getElementById("in-note").value.trim() };
      if (cur === "job") e.hours = Number(hrs.value) || r2(a / s.rate);
      if (cur === "spend") {
        var nc = newCat.hidden ? "" : newCat.value.trim();
        if (nc) {
          var hit = catList().filter(function (c) { return catLabel(c).toLowerCase() === nc.toLowerCase(); })[0];
          if (hit) nc = hit; else own.cats = uniqCats(catList().concat([nc]));
        }
        if (nc || pickedCat) e.cat = nc || pickedCat;
      }
      if (cur === "debt") { var d = debtById(dsel.value); e.debtId = dsel.value; if (d && e.amount > debtLeftOf(d)) e.amount = debtLeftOf(d); }
      addEntry(e);
      closeSheet(); render();
      toast(cur === "balance" ? t("balUpdated") : t("savedLog"));
    });
    setTimeout(function () { (cur === "job" ? hrs : amt).focus(); }, 60);
  }
  function closeSheet() { layer.innerHTML = ""; }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && layer.innerHTML) closeSheet(); });

  var toastTimer;
  function toast(msg) {
    var el = document.querySelector(".toast"); if (el) el.remove();
    el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
    document.body.appendChild(el); clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.remove(); }, 2400);
  }

  // ---------- events ----------
  document.querySelector(".tabbar").addEventListener("click", function (ev) { var b = ev.target.closest("[data-tab]"); if (b) go(b.dataset.tab); });
  function go(tab) { ui.tab = tab; try { sessionStorage.setItem(KEY + "-tab", tab); } catch (e) {} render(); window.scrollTo(0, 0); }
  document.getElementById("addBtn").onclick = function () { openSheet("spend"); };

  app.addEventListener("click", function (ev) {
    var b, id = ev.target.id;
    if ((b = ev.target.closest("[data-lang]"))) {
      if (ui.tab === "settings") saveSettings(true);
      own.lang = b.dataset.lang; if (ui.viewing) { try { localStorage.setItem(KEY, JSON.stringify(own)); } catch (e) {} } else save(); render(); return;
    }
    if (ui.viewing && !ui.viewing.parent && id === "view-close") return closeReport();
    if (id === "upd-now") return doUpdate();
    if (id === "upd-check") return checkUpdate(true);
    if (id === "upd-seen") { own.seenVersion = APP_VERSION; persist(); render(); return; }
    if (ui.viewing && ui.viewing.parent) {
      if (id === "pv-refresh") { parentPull(true); render(); return; }
      if ((b = ev.target.closest("[data-pv-ok]"))) { var pe = state.entries.find(function (x) { return x.id === b.dataset.pvOk; }); if (pe) decide(pe.id, !pe.approved, pe.parentNote || ""); return; }
      if ((b = ev.target.closest("[data-pv-note]"))) return openNoteSheet(b.dataset.pvNote);
      if ((b = ev.target.closest("[data-pv-del]"))) {
        if (b.dataset.confirm) return parentRemove(b.dataset.pvDel);
        b.dataset.confirm = "1"; b.textContent = t("pv_deleteQ"); b.classList.add("danger"); b.classList.remove("ghost");
        setTimeout(function () { if (b.isConnected) { delete b.dataset.confirm; b.innerHTML = icon("trash"); b.classList.remove("danger"); b.classList.add("ghost"); } }, 3000);
        return;
      }
      if ((b = ev.target.closest("[data-pvd-rm]"))) { readPvDebts(); pv.debts.splice(Number(b.dataset.pvdRm), 1); render(); return; }
      if (id === "pvd-add") { readPvDebts(); pv.debts.push({ id: uid(), name: "", total: 0, monthly: 0 }); render(); var ins = document.querySelectorAll('[data-f="name"]'); if (ins.length) ins[ins.length - 1].focus(); return; }
      if (id === "pvd-save") return saveDebts();
      if (id === "pa-save") return saveParentAllowance();
      if (id === "ac-add") return openExtraSheet();
      if ((b = ev.target.closest("[data-ex-rm]"))) {
        if (b.dataset.confirm) { var xid = b.dataset.exRm; return saveExtras(pvExtras().filter(function (x) { return x.id !== xid; }), "ac_removed"); }
        armDelete(b);
        return;
      }
      if (id === "fam-share" && own.cloud.code) return shareCode(own.cloud.code);
      if (id === "fam-code-me") { rpc("pm_invite", { p_token: own.cloud.token, p_member: own.cloud.member }).then(function (r) { own.cloud.code = r.code; own.cloud.codeAt = Date.now(); own.cloud.codeMe = true; persist(); render(); window.scrollTo(0, 0); }).catch(function () { toast(t("pv_fail")); }); return; }
      if (id === "fam-code") { own.cloud.codeMe = false; rpc("pm_invite", { p_token: own.cloud.token, p_member: ui.viewing.member || null }).then(function (r) { own.cloud.code = r.code; own.cloud.codeAt = Date.now(); persist(); render(); window.scrollTo(0, 0); }).catch(function () { toast(t("pv_fail")); }); return; }
    }
    if (id === "fam-leave") { document.getElementById("fam-leave-zone").innerHTML = '<div class="row wrapping"><span style="font-weight:600">' + t("fam_leaveQ") + '</span><button class="btn danger small" id="fam-leave-yes">' + t("yesRemove") + '</button><button class="btn ghost small" id="fam-leave-no">' + t("cancel") + '</button></div>'; return; }
    if (id === "fam-leave-yes") return leaveFamily();
    if (id === "fam-leave-no") { render(); return; }

    if ((b = ev.target.closest("[data-seg]"))) {
      var grp = b.dataset.seg, panes = app.querySelectorAll('[data-pane="' + grp + '"]');
      ui[grp] = b.dataset.val;
      if (!panes.length) { render(); return; }
      app.querySelectorAll('[data-seg="' + grp + '"]').forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
      panes.forEach(function (x) { x.hidden = x.dataset.val !== b.dataset.val; });
      return;
    }
    if ((b = ev.target.closest("[data-go]"))) { if (b.dataset.go === "log") ui.lv = b.dataset.lv || "list"; return go(b.dataset.go); }
    if ((b = ev.target.closest("[data-bv]"))) { ui.bv = b.dataset.bv; ui.bm = 0; render(); return; }
    if ((b = ev.target.closest("[data-bm-to]"))) { ui.bm = Number(b.dataset.bmTo) || 0; render(); return; }
    if ((b = ev.target.closest("[data-bm]"))) { ui.bm = Math.min(0, (ui.bm || 0) + Number(b.dataset.bm)); render(); return; }
    if ((b = ev.target.closest("[data-cat-rm]"))) {
      var cr = b.closest(".cat-row"), cc = document.getElementById("cat-card");
      if (cr.dataset.cat) { var gl = JSON.parse(cc.dataset.gone || "[]"); gl.push(cr.dataset.cat); cc.dataset.gone = JSON.stringify(gl); }
      cr.remove(); return;
    }
    if (id === "cat-add") {
      var row = document.createElement("div"); row.className = "row cat-row"; row.dataset.cat = "";
      row.innerHTML = '<input type="text" maxlength="24" placeholder="' + t("cat_newPh") + '" aria-label="' + t("cat_label") + '"><button class="btn ghost small" data-cat-rm="1">' + t("removeDebt") + '</button>';
      document.querySelector("#cat-card .cat-list").appendChild(row); row.querySelector("input").focus(); return;
    }
    if (id === "cat-save") {
      if (ui.viewing && ui.viewing.parent) return saveParentCats();
      if (ui.viewing || isKidCloud()) return;
      own.cats = readCatEditor().list; save(); render(); toast(t("cat_saved")); return;
    }
    if (ui.viewing) return;
    if ((b = ev.target.closest("[data-quick]"))) return openSheet(b.dataset.quick, null, b.dataset.debt);
    if ((b = ev.target.closest("[data-act=balance]"))) return openSheet("balance", b.dataset.acct);
    if ((b = ev.target.closest("[data-del]"))) {
      if (b.dataset.confirm) { var rr = removeEntry(b.dataset.del); if (rr === "approved") toast(t("approvedLocked")); else if (rr === "parent") toast(t("debtsByParent")); else { render(); toast(t("entryDeleted")); } }
      else armDelete(b);
      return;
    }
    if (id === "upd-undo") {
      var pu = preUpdate();
      if (pu && pu.data) { var keepUrl = own.syncUrl, keepCloud = own.cloud; own = state = normalize(pu.data); if (!own.syncUrl) own.syncUrl = keepUrl; if (!own.cloud) own.cloud = keepCloud; own.seenVersion = APP_VERSION; save(); try { localStorage.removeItem(KEY + "-preupdate"); } catch (e) {} ui.sim = null; render(); toast(t("updUndone")); }
      return;
    }
    if (id === "fam-join") return joinFamily(document.getElementById("fam-code-in").value);
    if (id === "fam-create") return createFamily(document.getElementById("fam-pname").value.trim(), document.getElementById("fam-kname").value.trim());
    if (id === "fam-sync") return cloudSync(true);
    if (id === "sync-save") {
      var u = document.getElementById("sync-url").value.trim();
      if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) { toast(t("syncBad")); return; }
      own.syncUrl = u; own.syncErr = false; persist(); syncNow(true); render(); return;
    }
    if (id === "install-go" && installEvt) { installEvt.prompt(); installEvt.userChoice.then(function () { installEvt = null; render(); }); return; }
    if (id === "install-later") { own.installLater = true; persist(); render(); return; }
    if (id === "sync-share" && own.syncUrl) {
      var link = location.href.split("#")[0] + "#sync=" + encodeURIComponent(own.syncUrl);
      var txt = t("syncShareText");
      var fb = function () { var box = document.getElementById("share-fallback"); if (box) { box.hidden = false; var ta = document.getElementById("share-text"); ta.value = txt + "\n" + link; ta.select(); } else toast(link); };
      if (navigator.share) navigator.share({ title: t("appName"), text: txt, url: link }).catch(function (e) { if (e && e.name !== "AbortError") fb(); });
      else { try { navigator.clipboard.writeText(txt + "\n" + link).then(function () { toast(t("linkCopied")); }, fb); } catch (e) { fb(); } }
      return;
    }
    if (id === "sync-remove") { own.syncUrl = ""; own.syncAt = 0; persist(); render(); return; }
    if (id === "share-parent") return shareParent();
    if (id === "report-open") { try { openReport(JSON.parse(localStorage.getItem(KEY + "-report"))); } catch (e) {} return; }
    if (id === "sim-save-btn") {
      var p = ui.sim;
      state.s.hours = p.hours; state.s.gas = p.gas; state.s.other = p.other; state.s.save = p.save;
      save(); toast(t("budgetUpdated")); return;
    }
    if (id === "set-save") return saveSettings();
    if (id === "bk-copy") {
      var code = btoa(unescape(encodeURIComponent(JSON.stringify(own))));
      var fallback = function () { document.getElementById("bk-area").hidden = false; var ta = document.getElementById("bk-text"); ta.value = code; ta.select(); toast(t("selectCopy")); };
      try { navigator.clipboard.writeText(code).then(function () { toast(t("backupCopied")); }, fallback); } catch (e) { fallback(); }
      return;
    }
    if (id === "bk-show") { document.getElementById("bk-area").hidden = false; document.getElementById("bk-text").focus(); return; }
    if (id === "bk-restore") {
      try {
        var data = JSON.parse(decodeURIComponent(escape(atob(document.getElementById("bk-text").value.trim()))));
        if (!data.accounts || !data.entries) throw 0;
        var kc = own.cloud; own = state = normalize(data); if (!own.cloud) own.cloud = kc; save(); ui.sim = null; go("home"); toast(t("backupRestored"));
      } catch (e) { toast(t("badCode")); }
      return;
    }
    if (id === "reset-ask") {
      document.getElementById("reset-zone").innerHTML = '<div class="row wrapping"><span style="font-weight:600">' + t("reallyDelete") + '</span><button class="btn danger small" id="reset-yes">' + t("yesDelete") + '</button><button class="btn ghost small" id="reset-no">' + t("cancel") + '</button></div>';
      return;
    }
    if (id === "reset-no") { render(); return; }
    if (id === "reset-yes") { var keep = { lang: own.lang, syncUrl: own.syncUrl, name: own.name, installLater: own.installLater, seenVersion: own.seenVersion, cloud: own.cloud }; own = state = Object.assign(normalize(null), keep); save(); ui.sim = null; go("home"); toast(t("allDeleted")); return; }
  });
  app.addEventListener("input", function (ev) {
    if (ev.target.id && ev.target.id.indexOf("sim-") === 0) { readSim(); updatePlan(); }
    if (ev.target.dataset && ev.target.dataset.al) allowFormChanged(ev.target.dataset.al, /-mode$/.test(ev.target.id));
  });
  app.addEventListener("change", function (ev) {
    if (ev.target.dataset && ev.target.dataset.al) allowFormChanged(ev.target.dataset.al, /-mode$/.test(ev.target.id));
    if (ev.target.id === "ac-start" && ev.target.value) { own.acStart = ev.target.value; persist(); render(); var ac = document.getElementById("ac-card"); if (ac) ac.scrollIntoView({ block: "start" }); }
  });
  window.addEventListener("hashchange", checkHash);
  var lastVisSync = 0;
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && Date.now() - lastVisSync > 30000) { lastVisSync = Date.now(); if (own.syncUrl) syncNow(); cloudSync(); parentPull(); }
    if (document.visibilityState === "visible" && Date.now() - upd.at > 10 * 60000) checkUpdate();
  });

  try { if ("serviceWorker" in navigator && canInstall()) navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
  if (isParent()) { try { pv.res = JSON.parse(localStorage.getItem(KEY + "-parent")); } catch (e) {} enterParent(true); }
  render();
  var hashed = checkHash();
  if (!hashed && own.syncUrl) setTimeout(syncNow, 2500);
  if (isKidCloud()) setTimeout(cloudSync, 1800);
  if (isParent()) parentPull(true);
  setTimeout(checkUpdate, 1200);
})();
</script>
</body>
